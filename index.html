<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IndoManager — Simulasi Manajer Minimarket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- HEADER -->
  <header class="app-header">
    <div class="header-left">
      <div class="avatar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
      <div class="header-text">
        <span class="header-greet">Selamat datang,</span>
        <span class="header-name">Manager</span>
      </div>
    </div>
    <button id="btn-next-day" class="btn-next-day" title="Hari berikutnya">
      <span>Hari Berikutnya</span>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="13 17 18 12 13 7"></polyline>
        <polyline points="6 17 11 12 6 7"></polyline>
      </svg>
    </button>
  </header>

  <!-- MAIN CONTENT -->
  <main class="app-main">

    <!-- TAB: HOME -->
    <section class="tab-page" id="tab-home">

      <div class="balance-card">
        <div class="balance-deco balance-deco-1"></div>
        <div class="balance-deco balance-deco-2"></div>
        <div class="balance-card-inner">
          <div class="balance-row-top">
            <span class="balance-label">Saldo Anda</span>
            <span class="balance-day" id="stat-hari">Hari 1</span>
          </div>
          <div class="balance-amount" id="stat-saldo">Rp 5.000.000</div>
          <div class="balance-row-bottom">
            <div class="balance-mini">
              <span class="balance-mini-label">Level</span>
              <span class="balance-mini-value" id="stat-level">1</span>
            </div>
            <div class="balance-mini">
              <span class="balance-mini-label">Reputasi</span>
              <span class="balance-mini-value" id="stat-reputasi">50</span>
            </div>
            <div class="balance-mini">
              <span class="balance-mini-label">Cabang</span>
              <span class="balance-mini-value" id="stat-cabang">0</span>
            </div>
          </div>
        </div>
      </div>

      <div class="quick-actions">
        <button class="quick-action" data-tab="toko">
          <span class="quick-icon" style="background:#E8F7EE">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#00B14F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1-5h16l1 5"></path><path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"></path><path d="M9 21V13h6v8"></path></svg>
          </span>
          <span class="quick-label">Toko</span>
        </button>
        <button class="quick-action" data-tab="karyawan">
          <span class="quick-icon" style="background:#EAF3FC">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#1E88E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          </span>
          <span class="quick-label">Karyawan</span>
        </button>
        <button class="quick-action" data-tab="peta">
          <span class="quick-icon" style="background:#FDF2E3">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#F5A623" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>
          </span>
          <span class="quick-label">Peta</span>
        </button>
        <button class="quick-action" data-tab="upgrade">
          <span class="quick-icon" style="background:#FCEAEC">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#E63946" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
          </span>
          <span class="quick-label">Upgrade</span>
        </button>
      </div>

      <div class="section-block">
        <div class="section-title-row">
          <h2 class="section-title">Aktivitas Terbaru</h2>
        </div>
        <div class="activity-log" id="activity-log"></div>
      </div>

    </section>

    <!-- TAB: TOKO -->
    <section class="tab-page hidden" id="tab-toko">
      <div class="section-block">
        <div class="section-title-row">
          <h2 class="section-title">Produk Toko</h2>
          <span class="section-sub" id="toko-summary"></span>
        </div>
        <div class="list-col" id="produk-list"></div>
      </div>
    </section>

    <!-- TAB: PETA -->
    <section class="tab-page hidden" id="tab-peta">
      <div class="section-block">
        <div class="section-title-row">
          <h2 class="section-title">Ekspansi Cabang</h2>
          <span class="section-sub" id="peta-summary"></span>
        </div>
        <div id="map"></div>
        <div class="list-col" id="kota-list" style="margin-top:16px;"></div>
      </div>
    </section>

    <!-- TAB: KARYAWAN -->
    <section class="tab-page hidden" id="tab-karyawan">
      <div class="section-block">
        <div class="section-title-row">
          <h2 class="section-title">Karyawan</h2>
          <span class="section-sub" id="karyawan-summary"></span>
        </div>
        <button class="btn-primary btn-full" id="btn-rekrut">Rekrut Karyawan Baru</button>
        <div class="list-col" id="karyawan-list" style="margin-top:14px;"></div>
      </div>
    </section>

    <!-- TAB: UPGRADE -->
    <section class="tab-page hidden" id="tab-upgrade">
      <div class="section-block">
        <div class="section-title-row">
          <h2 class="section-title">Upgrade Toko</h2>
        </div>
        <div class="list-col" id="upgrade-list"></div>
      </div>
    </section>

  </main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="home">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span>Home</span>
    </button>
    <button class="nav-item" data-tab="toko">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1-5h16l1 5"></path><path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"></path><path d="M9 21V13h6v8"></path></svg>
      <span>Toko</span>
    </button>
    <button class="nav-item" data-tab="peta">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></svg>
      <span>Peta</span>
    </button>
    <button class="nav-item" data-tab="karyawan">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      <span>Karyawan</span>
    </button>
    <button class="nav-item" data-tab="upgrade">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
      <span>Upgrade</span>
    </button>
  </nav>

</div>

<!-- TOAST -->
<div id="toast" class="toast hidden"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
